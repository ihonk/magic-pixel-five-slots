<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17103a"><title>魔法像素 · 五槽实验场</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#fff;background:#140d2c;touch-action:manipulation}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -20%,#7754c2 0,transparent 50%),linear-gradient(#231346,#110c28);overflow-x:hidden}.game{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px 8px}.brand{font-size:17px;font-weight:950;letter-spacing:.03em;text-shadow:0 3px #412171}.brand span{color:#ffe17b}.round{border:1px solid #ffffff50;background:#ffffff19;color:#fff;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700}.hud{display:flex;gap:8px;align-items:center;justify-content:space-between}.badge{padding:7px 12px;border-radius:30px;background:#6e4db5;border:1px solid #ffffff55;box-shadow:inset 0 1px #ffffff55,0 4px #110923;font-weight:800;font-size:14px}.hint{font-size:13px;color:#ded0ff;text-align:right}.board-wrap{position:relative;flex:0 0 auto;height:min(48dvh,470px);min-height:300px;margin:10px 0;border:4px solid #747082;border-radius:18px;overflow:hidden;background:radial-gradient(circle at center,#403263,#241a45);box-shadow:0 16px 30px #09051d,inset 0 0 28px #a6a0ff5c}canvas{display:block;width:100%;height:100%;touch-action:none}.board-label{position:absolute;top:10px;left:12px;background:#120d2da8;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;pointer-events:none}.toast{height:25px;text-align:center;font-size:14px;color:#ffe993;font-weight:700}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px;background:#301f59;border-radius:16px;border:2px solid #a07add;box-shadow:inset 0 3px #ffffff36}.slot{height:54px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid #735fa9;border-radius:12px;background:#180f34;box-shadow:inset 0 4px 8px #0008;color:#9b8abf;font-weight:900}.orb{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;text-shadow:0 2px 3px #000b;border:2px solid #ffffffa8;box-shadow:inset -5px -8px 6px #0005,inset 3px 4px 5px #fff8,0 4px 8px #0007;font-size:19px}.slot .orb{width:34px;height:34px;font-size:16px}.slot.casting{border-color:#fff6ac;box-shadow:inset 0 4px 8px #0008,0 0 8px #ffeb9166}.orb{position:relative;isolation:isolate}.orb::before{content:"";position:absolute;z-index:-1;top:-12px;left:27%;width:48%;height:15px;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(130deg,#f9e7ff,#5c388f);filter:drop-shadow(0 2px 2px #180b31)}@keyframes castPulse{to{transform:translateY(-3px);filter:brightness(1.3)}}.count{position:absolute;right:-5px;top:-6px;background:#fff;color:#21133e;border-radius:9px;font-size:11px;min-width:18px;padding:1px 3px;box-shadow:0 2px #0005}.tray-title{display:flex;justify-content:space-between;margin:10px 2px 6px;color:#e5d7ff;font-size:13px;font-weight:700}.queues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-bottom:12px}.queue{border:2px solid #b782e9;border-radius:15px;background:linear-gradient(#583d87,#34235e);min-height:74px;padding:7px 4px;color:white;box-shadow:0 5px #1a1038;cursor:pointer}.queue:active{transform:translateY(3px);box-shadow:0 2px #1a1038}.queue:disabled{opacity:.5;cursor:default}.queue-face{display:flex;gap:3px;justify-content:center;align-items:center}.queue small{display:block;margin-top:4px;font-weight:800;color:#d8c9ff}.next{width:16px;height:16px;border-radius:50%;border:1px solid #fff9;opacity:.85}.modal{position:fixed;inset:0;background:#0b0717c9;display:grid;place-items:center;padding:20px;z-index:10}.modal[hidden]{display:none}.dialog{width:min(100%,390px);padding:25px;background:linear-gradient(145deg,#6e4abe,#332064);border:3px solid #c5a9ff;border-radius:22px;text-align:center;box-shadow:0 20px 60px #0009}.dialog h2{font-size:28px;margin:0 0 10px}.dialog p{line-height:1.5;color:#f4eaff}.action{border:0;border-radius:12px;padding:13px 25px;background:linear-gradient(#b9ff81,#59c651);color:#173c1b;font-size:17px;font-weight:950;box-shadow:0 5px #208b32}.help{position:fixed;inset:0;z-index:11;background:#100a22ef;padding:30px max(24px,calc((100vw - 600px)/2));overflow:auto}.help[hidden]{display:none}.help h2{margin-top:20px}.help p,.help li{line-height:1.65}.help button{margin-top:12px}@media(max-height:690px){.board-wrap{height:44dvh;min-height:240px;margin:6px 0}.slot{height:45px}.queue{min-height:63px}}
</style></head><body><main class="game"><header><div class="brand">✦ 魔法<span>像素</span></div><div><button class="round" id="helpBtn">规则</button> <button class="round" id="resetBtn">重开</button></div></header><div class="hud"><div class="badge" id="levelText">第 1 关</div><div class="hint" id="progress">剩余像素 · 0</div></div><div class="board-wrap" id="boardWrap"><div class="board-label" id="boardLabel">四方向连锁</div></div><div class="toast" id="toast" aria-live="polite"></div><div class="slots" id="slots" aria-label="五个固定施法栏位"></div><div class="tray-title"><span>选择队首巫师</span><span id="slotCount">施法栏位 0 / 5</span></div><div class="queues" id="queues"></div></main><div class="modal" id="modal" hidden><div class="dialog"><h2 id="modalTitle"></h2><p id="modalBody"></p><button class="action" id="modalAction"></button></div></div><div class="help" id="help" hidden><h2>玩法规则</h2><p>点一个队列，把队首巫师放进五个固定栏位。巫师自动攻击自己颜色中从底部露出的方块。</p><ul><li>同色方块沿上下左右连锁，L 形可以连通，斜角不连通。</li><li>每一列从下往上看，下方方块挡住上方颜色。</li><li>巫师上的数字是可施法次数。没有目标时会留在栏位里。</li><li>清空画板获胜；五槽占满且无人能攻击时失败。</li></ul><button class="action" id="closeHelp">开始游戏</button></div><script type="module" src="./game.js?v=20261124-soft-light"></script></body></html>
